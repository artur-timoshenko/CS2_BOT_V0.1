<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bot Arena</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1712; font: 14px/1.3 system-ui, sans-serif; color: #fff; }
  [hidden] { display: none !important; } /* panels below set their own display, which would beat the hidden attribute */
  /* HUD laid out like CS2's current one: a short line across the bottom centre through the team badge, armor + health at
     its left end, ammo at its right end, weapon slots stacked at the right edge with the selected weapon's name.
     White, like the default HUD colour. Icons are the game's own (models.json "hud"), tinted through a CSS mask. */
  #hud, #top { font-family: Bahnschrift, "DIN Alternate", "Segoe UI", system-ui, sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.85); pointer-events: none; }
  #hud { color: #f2f2f2; --ring: #b44fd6; }
  #hud .mask { display: inline-block; background: currentColor; -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat; }
  #hud .low, #hpwrap.hurt #hp { color: #ff4b3e; }
  #hline { position: fixed; left: 30%; right: 30%; bottom: 44px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55) 20%, rgba(255,255,255,.55) 80%, transparent); }
  #hleft, #hright { position: fixed; bottom: 26px; display: flex; align-items: flex-end; gap: 14px; }
  #hleft { right: 71%; gap: 12px; } #hright { left: 71%; gap: 6px; }
  #shield { position: relative; width: 26px; height: 31px; }
  #shield .mask { position: absolute; inset: 0; }
  #ar { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 9px; font-weight: 700; font-style: normal; }
  #hp, #clip { font-size: 30px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  #hpwrap { position: relative; padding-bottom: 7px; min-width: 42px; }
  #hpbar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; }
  #hpbar i { position: absolute; top: 0; bottom: 0; left: 0; }
  #hpdmg { background: #e0322a; transition: width .6s .25s; } /* the health just lost, shown red for a moment */
  #hpcur { background: #f2f2f2; }
  #sep { width: 1px; height: 22px; background: currentColor; opacity: .55; margin: 0 3px 3px; }
  #reserve { font-size: 16px; font-weight: 700; padding-bottom: 3px; }
  #ic-bullet { width: 20px; height: 20px; margin: 0 0 3px 8px; }
  #rl { position: absolute; left: 0; right: 0; bottom: -8px; height: 2px; background: currentColor; transform-origin: left; transform: scaleX(0); }
  #emblem { position: fixed; left: 50%; bottom: 10px; width: 66px; height: 66px; transform: translateX(-50%); border: 3px solid var(--ring);
    border-radius: 50%; background: rgba(15,12,18,.6); display: grid; place-items: center; font-size: 21px; font-weight: 700; color: #f0c040; }
  #emblem .mask { width: 42px; height: 42px; }
  #emblem.ct { color: #8fb8ff; }
  #inv { position: fixed; right: 26px; bottom: 90px; display: flex; flex-direction: column; align-items: flex-end; gap: 22px; }
  #inv .slot { position: relative; display: flex; flex-direction: column; align-items: flex-end; color: #f2f2f2; opacity: .55; padding-right: 18px; }
  #inv .slot.cur { opacity: 1; }
  #inv .slot small { position: absolute; right: 0; top: -10px; font-size: 13px; font-weight: 700; }
  /* the exported icons point muzzle-right; CS2's slot column shows them muzzle-left, so mirror (left edge after flip = right) */
  #inv .slot i { width: 100px; height: 30px; transform: scaleX(-1); -webkit-mask-position: left center; mask-position: left center; }
  #inv .slot span { font-size: 15px; letter-spacing: .04em; }
  #inv .slot em { display: none; font-style: normal; font-size: 14px; margin-top: 8px; white-space: nowrap; }
  #inv .slot.cur em { display: block; }
  /* slot 4: every grenade carried, side by side; the one in hand bright */
  #inv .nades { display: flex; flex-direction: row-reverse; gap: 6px; }
  #inv .nades i { width: 22px; height: 26px; transform: none; -webkit-mask-position: center; mask-position: center; opacity: .55; }
  #inv .nades i.cur { opacity: 1; }
  /* sniper scope: black outside the lens, thin cross; AUG/SG 553: smaller lens with a red dot */
  #scope { position: fixed; inset: 0; pointer-events: none; display: none; background: radial-gradient(circle closest-side, transparent 98%, #000 100%); }
  #scope::before, #scope::after { content: ''; position: absolute; background: #000; }
  #scope::before { left: 0; right: 0; top: 50%; height: 1px; } #scope::after { top: 0; bottom: 0; left: 50%; width: 1px; }
  #scope.rifle { background: radial-gradient(circle closest-side, transparent 62%, #000 64%); }
  #scope.rifle::before, #scope.rifle::after { display: none; }
  #scope.rifle i { position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #ff2a1a; }
  #flash { position: fixed; inset: 0; pointer-events: none; background: #fff; opacity: 0; }
  #pos { position: fixed; left: 50%; bottom: 4px; transform: translateX(-50%); font: 11px monospace; opacity: .45; text-shadow: 0 1px 2px #000; }
  #top { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); display: flex; align-items: stretch; font-size: 22px; font-weight: 700; }
  #top span { padding: 3px 14px; background: rgba(0,0,0,.55); }
  #top .t { color: #e8b23a; border-radius: 4px 0 0 4px; } #top .ct { color: #5aa0ff; border-radius: 0 4px 4px 0; }
  #top .clock { background: rgba(0,0,0,.7); min-width: 3.2ch; text-align: center; font-variant-numeric: tabular-nums; }
  #settings { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 10; min-width: 300px; padding: 18px 22px;
    background: rgba(12,12,14,.9); border: 1px solid rgba(255,255,255,.15); border-radius: 8px; font-family: Bahnschrift, system-ui, sans-serif; }
  #settings h2 { margin: 0 0 10px; font-size: 18px; letter-spacing: .05em; }
  #settings label { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin: 12px 0; }
  #settings input[type=number] { width: 72px; font: inherit; } #settings output { min-width: 3ch; text-align: right; }
  #settings button { margin-top: 8px; width: 100%; padding: 8px; font: inherit; font-weight: 700; cursor: pointer; }
  #settings p { margin: 10px 0 0; font-size: 12px; opacity: .6; }
  /* demo player: transport bar under the score, player list under the radar */
  #demobar { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); width: max(300px, min(560px, calc(100vw - 580px))); padding: 8px 12px;
    background: rgba(12,12,14,.8); border-radius: 6px; font-family: Bahnschrift, system-ui, sans-serif; font-size: 14px; }
  #demobar .row { display: flex; align-items: center; gap: 8px; }
  #demobar button, #demobar select { font: inherit; padding: 2px 8px; cursor: pointer; }
  #demobar .time { font-variant-numeric: tabular-nums; margin-left: auto; opacity: .85; }
  #demotl { position: relative; margin-top: 6px; } #demotl input { width: 100%; margin: 0; }
  #demotl .mk { position: absolute; top: -3px; width: 2px; height: 6px; background: #e8b23a; pointer-events: none; }
  #demotl .mk.ct { background: #5aa0ff; }
  /* demo HUD like CS2's: score bar on top — CT left, T right, a square per player (dims with a cross when dead), the round
     clock or, once planted, the bomb blinking with its beeps; each side's players in a bottom corner; round-win banner */
  #dtop { position: fixed; left: 50%; top: 8px; transform: translateX(-50%); display: flex; align-items: stretch; gap: 6px;
    font-family: Bahnschrift, system-ui, sans-serif; text-shadow: 0 1px 2px #000; color: #f2f2f2; }
  #dtop .side { display: flex; align-items: center; gap: 6px; }
  #dtop .score { min-width: 42px; align-self: stretch; padding: 0 8px; font-size: 26px; font-weight: 700; display: grid; place-items: center; background: rgba(0,0,0,.6); }
  #dtop .ct .score { color: #8fb8ff; } #dtop .t .score { color: #f0c040; }
  #dtop .tname { font-size: 12px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; opacity: .85; }
  #dtop .sq { display: flex; gap: 3px; }
  #dtop .p { position: relative; width: 46px; height: 46px; border-radius: 3px; overflow: hidden; cursor: pointer; display: flex; align-items: flex-end;
    font-size: 10px; padding: 0 3px 5px; box-sizing: border-box; }
  #dtop .ct .p { background: linear-gradient(#2f5592, #142540); } #dtop .t .p { background: linear-gradient(#93701f, #3d2d0b); }
  #dtop .p b { position: absolute; left: 3px; top: 1px; font-size: 11px; opacity: .85; }
  #dtop .p span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dtop .p i { position: absolute; left: 0; bottom: 0; height: 3px; background: #ececec; }
  #dtop .p.low i { background: #ff4b3e; }
  #dtop .p.dead { filter: grayscale(1); opacity: .35; }
  #dtop .p.dead::after { content: '✕'; position: absolute; inset: 0; display: grid; place-items: center; font-size: 22px; }
  #dtop .p.cur { outline: 2px solid #fff; outline-offset: -2px; }
  #dtop .mid { min-width: 74px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,.7); padding: 2px 8px; }
  #dt-clock { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #dt-bomb { display: none; width: 30px; height: 30px; background: #ff3b2f; -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat; }
  #dtop .mid.bomb #dt-clock { display: none; } #dtop .mid.bomb #dt-bomb { display: block; }
  #dt-bomb.beep { background: #ffd0c8; filter: drop-shadow(0 0 6px #ff2a1a); } #dt-bomb.defused { background: #58d26a; }
  #dt-round { font-size: 11px; opacity: .8; }
  .dpanel { position: fixed; bottom: 96px; width: 250px; font-family: Bahnschrift, system-ui, sans-serif; font-size: 13px; text-shadow: 0 1px 2px #000; color: #f2f2f2; }
  .dpanel.ct { left: 16px; } .dpanel.t { right: 16px; }
  .dpanel .row { position: relative; display: flex; align-items: center; gap: 6px; height: 26px; padding: 0 6px; margin-top: 2px; background: rgba(10,10,12,.65); cursor: pointer; overflow: hidden; }
  .dpanel .bar { position: absolute; left: 0; top: 0; bottom: 0; opacity: .4; }
  .dpanel.ct .bar { background: #3b6fc0; } .dpanel.t .bar { background: #c0902a; }
  .dpanel .hp { position: relative; width: 26px; font-weight: 700; text-align: right; }
  .dpanel .nm { position: relative; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dpanel .w { position: relative; width: 56px; height: 18px; background: currentColor; transform: scaleX(-1); -webkit-mask: var(--u) center / contain no-repeat; mask: var(--u) center / contain no-repeat; }
  .dpanel.t .w { transform: none; }
  .dpanel .k { position: relative; width: 18px; text-align: right; font-style: normal; opacity: .85; }
  .dpanel .row.dead { opacity: .4; } .dpanel .row.cur { outline: 1px solid #fff; outline-offset: -1px; }
  #dbanner { position: fixed; left: 50%; top: 66px; transform: translateX(-50%); padding: 6px 26px; font: 700 22px Bahnschrift, system-ui, sans-serif;
    letter-spacing: .06em; text-align: center; background: rgba(0,0,0,.72); border-bottom: 3px solid; text-shadow: 0 1px 2px #000; }
  #dbanner.t { color: #f0c040; } #dbanner.ct { color: #8fb8ff; }
  #dbanner small { display: block; font-size: 13px; font-weight: 400; color: #ddd; letter-spacing: 0; }
  /* start menu (opening the page without parameters) */
  #menu { position: fixed; inset: 0; z-index: 50; display: grid; place-items: start center; padding: 8vh 0; box-sizing: border-box; overflow-y: auto; background: radial-gradient(circle at 50% 30%, #3a2f22, #14110d); font-family: Bahnschrift, system-ui, sans-serif; }
  #menu .box { width: min(440px, calc(100vw - 32px)); }
  #menu h1 { margin: 0 0 18px; font-size: 34px; letter-spacing: .08em; }
  #menu a { display: block; margin: 8px 0; padding: 14px 18px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 6px; color: #fff; text-decoration: none; font-size: 18px; }
  #menu a:hover, #menu a:focus-visible { background: rgba(255,255,255,.16); }
  #menu a small { display: block; font-size: 12px; opacity: .65; margin-top: 3px; }
  #menu h2 { margin: 22px 0 6px; font-size: 15px; opacity: .75; font-weight: 400; }
  #feed { position: fixed; right: 16px; top: 12px; text-align: right; text-shadow: 0 1px 3px #000; }
  #help { position: fixed; left: 16px; top: 258px; opacity: .8; max-width: 360px; text-shadow: 0 1px 3px #000; }
  #radar { position: fixed; left: 16px; top: 12px; width: 236px; height: 236px; }
  #cross { position: fixed; left: 50%; top: 50%; width: 14px; height: 14px; transform: translate(-50%, -50%);
    background: linear-gradient(#0f0, #0f0) center/2px 100% no-repeat, linear-gradient(#0f0, #0f0) center/100% 2px no-repeat; }
  #msg { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: 36px; font-weight: 700; text-shadow: 0 2px 6px #000; }
</style>

  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",

<body>
<div id="scope"><i></i></div><div id="flash"></div><canvas id="radar"></canvas><div id="help"></div><div id="top"></div><div id="feed"></div><div id="hud">
  <div id="hline"></div><div id="inv"></div>
  <div id="hleft"><span id="shield" aria-label="броня"><i id="ic-armor" class="mask"></i><em id="ar"></em></span><span id="hpwrap" aria-label="здоровье"><b id="hp"></b><i id="hpbar"><i id="hpdmg"></i><i id="hpcur"></i></i></span></div>
  <div id="emblem"></div>
  <div id="hright" aria-label="патроны"><b id="clip"></b><i id="sep"></i><span id="reserve"></span><i id="ic-bullet" class="mask"></i><i id="rl"></i></div>
</div><div id="pos"></div>
<div id="demobar" hidden>
  <div class="row"><button id="d-prev" type="button" title="предыдущий раунд (Shift+←)">⏮</button><button id="d-play" type="button" title="пауза (Space)">❚❚</button>
    <button id="d-next" type="button" title="следующий раунд (Shift+→)">⏭</button>
    <select id="d-speed" title="скорость (+/−)"><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>6</option><option>8</option></select>
    <span id="d-round"></span><span class="time" id="d-time"></span></div>
  <div id="demotl"><input type="range" id="d-tl" min="0" max="1" step="1" aria-label="таймлайн"></div>
</div>
<div id="dtop" hidden>
  <div class="side ct"><span class="tname" id="dt-ctname"></span><b class="score" id="dt-ctscore"></b><div class="sq" id="dt-ct"></div></div>
  <div class="mid" id="dt-mid"><div id="dt-clock"></div><i id="dt-bomb" title="бомба установлена"></i><small id="dt-round"></small></div>
  <div class="side t"><div class="sq" id="dt-t"></div><b class="score" id="dt-tscore"></b><span class="tname" id="dt-tname"></span></div>
</div>
<div class="dpanel ct" id="dp-ct" hidden></div><div class="dpanel t" id="dp-t" hidden></div><div id="dbanner" hidden></div>
<div id="menu" hidden><div class="box"><h1>BOT ARENA</h1>
  <a href="?map=de_dust2" id="menu-play">Играть с ботом<small>de_dust2, ты за T против бота</small></a>
  <h2>Просмотр демки</h2><div id="menu-demos">загрузка списка…</div>
  <a href="?play" style="font-size:14px;padding:9px 14px">Встроенная тестовая карта</a></div></div>
<div id="settings" hidden>
  <h2>Настройки</h2>
  <label>Бот на карте <input type="checkbox" id="set-bot"></label>
  <label>Общая громкость <input type="range" id="set-vol" min="0" max="100" step="1"><output id="set-vol-v"></output></label>
  <label>Громкость игры <input type="range" id="set-gvol" min="0" max="100" step="1"><output id="set-gvol-v"></output></label>
  <label>Гранаты <input type="checkbox" id="set-nades"></label>
  <label>Чувствительность (CS2) <input type="number" id="set-sens" min="0.05" max="20" step="0.01"></label>
  <label>Основное оружие <select id="set-primary"></select></label>
  <label>Пистолет <select id="set-secondary"></select></label>
  <button id="set-play" type="button">Играть</button>
  <p>Esc — открыть настройки снова</p>
</div><div id="cross"></div><div id="msg"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Env, WEAPONS, CATALOG, NADE, eye, rayWorld } from '/sim/core.js';
import { MAP } from '/sim/map.js';
import { stateAt, eventsBetween, roundAt, scoreAt, killsAt, utilityAt, teamsAt, bombAt, lastAt } from '/demo.js';
import { loadModels, muzzlePos, makeAvatar, updateAvatar, makeViewmodel, updateViewmodel, ensureWeapon, nadeModel } from '/avatar.js';
import { loadRadar, drawRadar } from '/radar.js';
import { createSound, footstep } from '/sound.js';
import { surfaceAt } from '/surfaces.js';

const DEG = Math.PI / 180, $ = id => document.getElementById(id);
const watchId = new URLSearchParams(location.search).get('watch'), demoName = new URLSearchParams(location.search).get('demo');
const v3 = (x, y, z) => new THREE.Vector3(x, z, -y); // Source (Z up) → three (Y up)
// Opened without parameters: the start menu — play against the bot on de_dust2, or watch one of public/demos
if (!['map', 'demo', 'watch', 'play'].some(k => new URLSearchParams(location.search).has(k))) {
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  $('menu').hidden = false;
  const { demos = [] } = await fetch('/api/demos').then(r => r.json()).catch(() => ({}));
  $('menu-demos').innerHTML = demos.length ? demos.map(d => `<a href="?demo=${encodeURIComponent(d.name)}">${esc(d.name)}<small>${new Date(d.mtime).toLocaleString()} · ${(d.size / 1e6).toFixed(1)} МБ</small></a>`).join('')
    : '<p>Демок нет: <code>py tools/import-demo.py match.dem</code></p>';
  await new Promise(() => {}); // the menu is the whole page: nothing else loads
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); // 4K/retina at full density costs 2–4× the GPU for little gain
// the GPU dropped the context (out of video memory, driver reset): reload instead of freezing on a black canvas
renderer.domElement.addEventListener('webglcontextlost', e => { e.preventDefault(); $('msg').textContent = 'Видеокарта сбросила контекст — перезагрузка…'; setTimeout(() => location.reload(), 1500); });
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
Object.assign(window, { scene, renderer }); // console access for debugging (draw calls: renderer.info.render)
scene.background = new THREE.Color(0x9cc4e4);
scene.fog = new THREE.Fog(0x9cc4e4, 2500, 7000);
// CS2 fov 90 is horizontal at 4:3 → 73.74° vertical, widened horizontally on wider screens (Hor+), same as the game.
// near 4: players never get within 16 units of a wall, and a farther near plane doubles depth precision at distance
const camera = new THREE.PerspectiveCamera(2 * Math.atan(Math.tan(45 * Math.PI / 180) * 3 / 4) * 180 / Math.PI, 1, 4, 10000);
camera.rotation.order = 'YXZ';
scene.add(new THREE.HemisphereLight(0xfff4e0, 0x806040, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(800, 2000, 500); scene.add(sun);
const resize = () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); };
addEventListener('resize', resize); resize();

// Imported real map (tools/import-map.js): voxel grid for the sim + original glTF for rendering.
async function loadImported(name) {
  const base = `/maps/${encodeURIComponent(name)}/`, json = await (await fetch(base + 'map.json')).json();
  const gz = (await fetch(base + 'grid.bin.gz')).body.pipeThrough(new DecompressionStream('gzip'));
  // real floor heights (tools/surface-map.js): the sim puts eyes/hitboxes on the real floor, footsteps read the surface
  const surfaces = await fetch(base + 'surfaces.json').then(r => (r.ok ? r.json() : undefined)).catch(() => undefined);
  return { ...json, base, surfaces, grid: { ...json.grid, bits: new Uint8Array(await new Response(gz).arrayBuffer()) } };
}
const DECAL_LIFT = 0.25; // Source units a decal floats off its surface: constant in world space, unlike a depth-buffer offset
const hidden = (o, scale = 1) => { // fixes a map mesh's material for three.js; returns true if the mesh is invisible in game
  const m = o.material, shader = m.userData?.vmat?.ShaderName || '', overlay = /static_overlay/.test(shader);
  // Source 2 foliage stores wind data in COLOR_0, not colour (renders purple); only overlays use it as tint/alpha
  if (m.vertexColors && !overlay) { m.vertexColors = false; m.needsUpdate = true; }
  if (overlay || (m.transparent && !m.alphaTest)) {
    // Decals/overlays (bombsite sprays, road lines, signs, stains) lie exactly on walls and floors: lift them a hair along
    // their normals so they never z-fight, draw them after the surface, and let texture/vertex alpha blend them in.
    const g = o.geometry, pos = g.attributes.position, nor = g.attributes.normal;
    if (nor && !g.userData.lifted) { // geometry can be shared between nodes: lift once
      const k = DECAL_LIFT / scale;
      for (let i = 0; i < pos.count; i++) pos.setXYZ(i, pos.getX(i) + nor.getX(i) * k, pos.getY(i) + nor.getY(i) * k, pos.getZ(i) + nor.getZ(i) * k);
      pos.needsUpdate = true; g.userData.lifted = true; g.computeBoundingSphere();
    }
    Object.assign(m, { transparent: true, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1 });
    o.renderOrder = 1; m.needsUpdate = true; o.userData.decal = true;
  }
  o.visible = !/csgo_effects|\bgeneric\.vfx|black_unlit/.test(shader);
  return !o.visible;
};
// Some exported triangles have degenerate UVs in every channel (texture smeared into streaks: walls, window insets).

  $('help').innerHTML = 'Клик — захват мыши. WASD, Space/колесо прыжок, C/Ctrl присед, Shift шаг, ЛКМ огонь, ПКМ очередь Glock / укол ножом / прицел снайперки, R перезарядка, F осмотр, 1 основное / 2 пистолет / 3 нож / 4 гранаты (ещё раз — следующая; зажать ЛКМ — далеко, ПКМ — под себя, обе — средне; оружие — в настройках, Esc), V вид от 3-го лица. Чувствительность 3.14 как в CS2 (другая: ?sens=)';
  let wheelJump = false; // mouse-wheel jump bind: one jump press per notch
  addEventListener('wheel', () => { wheelJump = true; inputEvents.push({ t: performance.now(), k: 'move' }); });
  // Inputs carry timestamps: the sim gets the sub-tick moment of key changes and clicks (CS2 sub-tick);
  // view angles follow the mouse every frame, the sim receives them at each tick.
  const MOVE_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'Space', 'KeyC', 'ControlLeft', 'ShiftLeft']);
  const keys = {}, mouse = { fire: false }, inputEvents = [], view = { yaw: env.players[0].yaw, pitch: 0 }, look = { yaw: 0, pitch: 0 };
  let SENS = 0.022 * settings.sens; // m_yaw × CS2 sensitivity
  let zoomSens = 1; // zoom_sensitivity_ratio 1: scoped, the mouse turns by the zoom fov / 90
  let slotPress = 0; // weapon keys act once per press (4 again = the next grenade)
  addEventListener('keydown', e => {
    if (!e.repeat && /^Digit[1-4]$/.test(e.code)) slotPress = +e.code[5];
    if (!e.repeat && e.code === 'KeyF' && cur.players[0]?.alive) inspect = { name: cur.players[0].weaponName, t0: performance.now(), last: -1 }; // F: inspect (again = restart)
  });
  const onKey = down => e => {
    // mouse captured = keys belong to the game: no browser shortcuts (Ctrl+S/D/F, Space scroll, Alt menu…); F-keys stay
    if (document.pointerLockElement && !/^F\d+$/.test(e.code)) e.preventDefault();
    if (MOVE_KEYS.has(e.code) && !!keys[e.code] !== down) inputEvents.push({ t: performance.now(), k: 'move' });
    keys[e.code] = down;
  };
  addEventListener('keydown', onKey(true));
  addEventListener('keyup', onKey(false));
  const showMenu = () => { const free = !document.pointerLockElement; $('help').style.display = free ? '' : 'none'; $('settings').hidden = !free; };
  document.addEventListener('pointerlockchange', showMenu); // in game: HUD only; mouse free (Esc): settings
  showMenu();
  // fallback where fullscreen is refused: closing the tab mid-game asks first
  addEventListener('beforeunload', e => { if (document.pointerLockElement) e.preventDefault(); });
  const capture = () => { // raw mouse input (no OS acceleration) like CS2; plain lock where unsupported
    // Ctrl+W/T/N can only be caught in fullscreen with the Keyboard Lock API (Ctrl = crouch, so Ctrl+W closed the tab)
    if (!document.fullscreenElement) document.documentElement.requestFullscreen?.().then(() => navigator.keyboard?.lock?.()).catch(() => {});
    renderer.domElement.requestPointerLock({ unadjustedMovement: true })?.catch?.(() => renderer.domElement.requestPointerLock()?.catch?.(() => {})); // lock refused (window unfocused): next click retries
  };
  renderer.domElement.addEventListener('click', capture);
  $('set-play').addEventListener('click', capture);
  addEventListener('mousemove', e => {
    if (!document.pointerLockElement) return;
    const s = SENS * zoomSens;
    view.yaw = wrapDeg(view.yaw - e.movementX * s); view.pitch = Math.max(-89, Math.min(89, view.pitch + e.movementY * s));
    look.yaw += e.movementX * s; look.pitch += e.movementY * s;
  });
  addEventListener('mousedown', e => { if (e.button === 0) { mouse.fire = true; inputEvents.push({ t: performance.now(), k: 'fire' }); } if (e.button === 2) mouse.alt = true; });
  addEventListener('mouseup', e => { if (e.button === 0) mouse.fire = false; if (e.button === 2) mouse.alt = false; });
  addEventListener('contextmenu', e => e.preventDefault()); // right-click = attack2 (Glock burst toggle, knife stab)
  const DTMS = 1000 / 64;
  let simWall = performance.now(), resetAt = 0, prev = snap(env.state()), cur = prev;
  const restart = () => { env.reset(); resetAt = 0; $('msg').textContent = ''; view.yaw = env.players[0].yaw; view.pitch = 0; prev = cur = snap(env.state()); };
  $('set-bot').checked = settings.bot; $('set-vol').value = settings.volume; $('set-vol-v').textContent = settings.volume; $('set-sens').value = settings.sens;
  $('set-gvol').value = settings.gameVolume; $('set-gvol-v').textContent = settings.gameVolume; $('set-nades').checked = settings.grenades;
  $('set-gvol').addEventListener('input', e => { settings.gameVolume = +e.target.value; $('set-gvol-v').textContent = settings.gameVolume; sound.setGameVolume(settings.gameVolume / 100); saveSettings(); });
  $('set-nades').addEventListener('change', e => { settings.grenades = e.target.checked; saveSettings(); env.cfg.grenades = grenades(); restart(); });
  for (const [id, slot] of [['set-primary', 'primary'], ['set-secondary', 'secondary']]) { // loadout: any CS2 gun for slots 1 and 2
    $(id).innerHTML = guns(slot).map(n => `<option value="${n}">${label(n)}</option>`).join('');
    $(id).value = settings[slot];
    $(id).addEventListener('change', e => {
      settings[slot] = e.target.value; saveSettings();
      env.cfg.loadout = loadout(); env.loadout = env.cfg.loadout.map(n => CATALOG[n]); restart(); // new round with the new guns
    });
  }
  $('set-bot').addEventListener('change', e => { settings.bot = e.target.checked; saveSettings(); env.cfg.opponent = settings.bot ? 'bot' : 'none'; restart(); });
  $('set-vol').addEventListener('input', e => { settings.volume = +e.target.value; $('set-vol-v').textContent = settings.volume; sound.setVolume(settings.volume / 100); saveSettings(); });
  $('set-sens').addEventListener('change', e => {
    const v = +e.target.value;
    if (v > 0) { settings.sens = v; SENS = 0.022 * v; saveSettings(); } else e.target.value = settings.sens; // ignore empty / zero
  });
  (function loop(now) {
    requestAnimationFrame(loop);
    if (now - simWall > 250) simWall = now - DTMS; // tab was hidden: don't fast-forward
    while (simWall + DTMS <= now) {
      const a0 = simWall, a1 = simWall + DTMS;
      simWall = a1;
      const fracOf = k => { const ev = inputEvents.find(e => e.k === k && e.t >= a0 && e.t < a1); return ev ? Math.max(1e-3, (ev.t - a0) / DTMS) : 0; };
      const moveFrac = fracOf('move'), fireFrac = fracOf('fire');
      while (inputEvents.length && inputEvents[0].t < a1) inputEvents.shift();
      if (env.done) {
        if (!resetAt) resetAt = now + 2000;
        else if (now > resetAt) { env.reset(); resetAt = 0; $('msg').textContent = ''; view.yaw = env.players[0].yaw; view.pitch = 0; prev = cur = snap(env.state()); }
        continue;
      }
      const me = env.players[0], slot = slotPress;
      slotPress = 0;
      env.step([[(keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0),
        wrapDeg(view.yaw - me.yaw), view.pitch - me.pitch, +(!!keys.Space || wheelJump), +!!(keys.KeyC || keys.ControlLeft), +!!keys.ShiftLeft,
        +(mouse.fire || fireFrac > 0), +!!keys.KeyR, slot, moveFrac, fireFrac, +!!mouse.alt]]);
      wheelJump = false;
      prev = cur; cur = snap(env.state());
      zoomSens = cur.players[0].zoomFov ? cur.players[0].zoomFov / 90 : 1;
      onEvents(env.events, env.players);
      if (env.done) $('msg').textContent = env.winner === 0 ? 'Победа' : env.winner === 1 ? 'Поражение' : 'Ничья';
    }
    render(lerpState(prev, cur, Math.min(1, (now - simWall) / DTMS)), env.players[0].alive ? view : null, look);
    look.yaw = look.pitch = 0;
  })(simWall);
}
</script>
</body>
</html>
